[pytest]
asyncio_mode = auto
# Phase 12B: pytest-asyncio 1.x removed support for overriding the built-in
# `event_loop` fixture (the mechanism this project's conftest.py used, pre-
# Phase-12A, to force one shared event loop for the whole test session).
# Against sqlite (aiosqlite/StaticPool, in-memory) that removal was silently
# invisible — nothing here depends on long-lived, event-loop-bound OS
# connections. Against real PostgreSQL via asyncpg it is not invisible:
# asyncpg connections are bound to the event loop that created them, so a
# module-level connection pool reused across tests running on *different*
# per-function event loops raises real cross-loop errors. This explicit
# config is the pytest-asyncio 1.x-supported way to get the same "one loop
# for the whole session" behavior the old custom fixture provided.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
