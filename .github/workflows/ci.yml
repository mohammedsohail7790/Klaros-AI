name: CI

# Phase 0 (KLAROS_PHASE_0_IMPLEMENTATION_PLAN.md §0.1): the first CI
# pipeline for this repository. See PHASE_0_IMPLEMENTATION_LOG.md's CI
# section for what was deliberately left out and why (no backend
# lint/typecheck step — no linter/typechecker is configured in this repo
# today, and configuring one from scratch is out of this Phase 0 slice's
# scope; no `next lint` — removed entirely in Next.js 16, confirmed by
# running it locally during this implementation; no Docker Compose
# up/smoke-test stage — Docker image builds only).
#
# No step in this workflow requires a production secret. AI_PROVIDER,
# EMBEDDING_PROVIDER, STT_PROVIDER and TTS_PROVIDER are all forced to
# "deterministic" so the suite never needs a real OpenAI/Anthropic key —
# see app/services/embedding_provider.py / speech_provider.py.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest, real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: klaros
          POSTGRES_PASSWORD: klaros
          POSTGRES_DB: klaros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klaros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://klaros:klaros@localhost:5432/klaros
      EVENT_TRANSPORT: memory
      AI_PROVIDER: deterministic
      EMBEDDING_PROVIDER: deterministic
      STT_PROVIDER: deterministic
      TTS_PROVIDER: deterministic
      STORAGE_LOCAL_ROOT: /tmp/klaros-ci-storage
      INTEGRATION_CREDENTIAL_ENCRYPTION_KEY: ci-only-not-a-real-secret-encryption-key
      JWT_SECRET: ci-only-not-a-real-secret
      RATE_LIMIT_BACKEND: memory
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic migrations against a real Postgres (schema + RLS policies)
        run: alembic upgrade head

      - name: Alembic downgrade/re-upgrade smoke test (migration reversibility)
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: pytest (full suite — sqlite-backed tests + postgres-only tests, since DATABASE_URL is real Postgres here)
        run: python -m pytest -q

      - name: autonomy_level deprecation guardrail
        run: ./scripts/check_autonomy_deprecation.sh

      - name: pip-audit (dependency vulnerability scan)
        run: pip-audit -r requirements.txt --skip-editable || true
        # Non-blocking for now (`|| true`): no pip-audit baseline has ever
        # been recorded for this project (requirements-dev.txt's own
        # comment called the previous mention of it "stale/aspirational").
        # Documented as a known limitation in PHASE_0_IMPLEMENTATION_LOG.md
        # — flip this to blocking once a first clean run establishes a
        # baseline (Phase 1 candidate, not Phase 0).

  backend-docker-build:
    name: Backend Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (build only, no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false

  frontend-checks:
    name: Frontend typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Vitest (frontend test harness — Phase 0 §0.7)
        run: npm run test

      - name: npm audit (dependency vulnerability scan)
        run: npm audit --omit=dev || true
        # Non-blocking: see PHASE_0_IMPLEMENTATION_LOG.md — the dev-only
        # esbuild/vite advisory pulled in by the pinned vitest@1.x line is
        # a known, documented, dev-server-only exposure, not exploitable
        # in this CI/test context; --omit=dev additionally keeps that
        # dev-dependency advisory from failing this step at all.

  frontend-docker-build:
    name: Frontend Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image (build only, no push)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
