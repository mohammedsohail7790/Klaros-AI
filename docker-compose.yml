version: "3.9"

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klaros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klaros}
      POSTGRES_DB: ${POSTGRES_DB:-klaros}
    # Bound to loopback only — never intended to be reachable from outside
    # this host. Still reachable at localhost:5432 for local dev tooling
    # (psql, a GUI client) on the same machine; a real production
    # deployment should point DATABASE_URL at a managed Postgres instead
    # of this container (see DEPLOYMENT_RUNBOOK.md) and can remove this
    # port mapping entirely.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-klaros}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only — see postgres comment above.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-klaros}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-klaros}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback only — the Temporal worker/backend reach this over the
    # internal Compose network (temporal:7233), not via this published
    # port; this mapping exists only for host-side tooling (tctl, a local
    # SDK client) to reach it during development.
    ports:
      - "127.0.0.1:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    # Loopback only — the Temporal UI ships with no authentication of its
    # own and would otherwise expose full workflow history/payloads to
    # anyone who can reach this port. Access it via `ssh -L 8080:localhost:8080`
    # (or equivalent) rather than publishing it further.
    ports:
      - "127.0.0.1:8080:8080"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-klaros}:${POSTGRES_PASSWORD:-klaros}@postgres:5432/${POSTGRES_DB:-klaros}
      - REDIS_URL=redis://redis:6379/0
      - EVENT_TRANSPORT=redis
      - RATE_LIMIT_BACKEND=redis
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Temporal Worker — runs durable, long-running business *workflows*
  # (InvoiceOverdueWorkflow, JobLifecycleWorkflow, etc.), NOT the event bus.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-klaros}:${POSTGRES_PASSWORD:-klaros}@postgres:5432/${POSTGRES_DB:-klaros}
      - REDIS_URL=redis://redis:6379/0
      - EVENT_TRANSPORT=redis
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.workers.main

  # Klaros Event Worker (Phase 8) — continuously consumes the durable event
  # store (Postgres) via the Redis Streams transport and runs every
  # subscribed domain handler (retention, finance, marketing, operations,
  # CRM, Morning Brief scheduling). This is NOT the Temporal worker above:
  # Temporal owns long-running multi-step business workflows: this process
  # owns event-bus consumption/fan-out. Losing it means published events
  # stop propagating — everything else keeps accepting requests.
  event-worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-klaros}:${POSTGRES_PASSWORD:-klaros}@postgres:5432/${POSTGRES_DB:-klaros}
      - REDIS_URL=redis://redis:6379/0
      - EVENT_TRANSPORT=redis
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m app.events.worker

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
