# Keeps the production API awake on Render's free plan, which puts a service to sleep after 15 minutes without traffic (the next request then waits up to a minute).
# This is a stop-gap: moving klaros-backend to a paid always-on instance makes this workflow unnecessary, and it can then be deleted.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://klaros-backend.onrender.com/health || true)
          echo "klaros-backend /health -> ${code}"
          test "${code}" = "200"
